<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한국저작권보호원 모의신고 훈련</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="desktop">
    <!-- 바탕화면 장식 아이콘 (넓은 화면에서만 표시) -->
    <div class="desk-icons" aria-hidden="true">
      <div class="desk-icon"><span>🖥️</span>내 PC</div>
      <div class="desk-icon"><span>📁</span>업무자료</div>
      <div class="desk-icon"><span>🛡️</span>클린신고센터</div>
      <div class="desk-icon"><span>🗑️</span>휴지통</div>
    </div>

    <main class="window" id="window">
      <div class="titlebar">
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="tab"><span class="tab-ico">🚨</span>한국저작권보호원 모의신고 훈련</div>
        <div class="titlebar-spacer"></div>
      </div>
      <div class="toolbar">
        <div class="nav-btns" aria-hidden="true"><span>‹</span><span>›</span><span>↻</span></div>
        <div class="addressbar" id="addressbar"><span class="lock">🔒</span><span id="addressText">모의신고훈련</span></div>
        <button type="button" class="home-btn" id="homeBtn" title="메인화면으로 이동">🏠 <span>처음으로</span></button>
      </div>
      <nav class="progress" id="progress" aria-label="진행 단계"></nav>
      <div class="screen" id="screen"></div>
    </main>

    <footer class="taskbar" aria-hidden="true">
      <div class="tb-start">🚨</div>
      <div class="tb-app active">모의신고 훈련</div>
      <div class="tb-spacer"></div>
      <div class="tb-clock" id="clock"></div>
    </footer>
  </div>

  <!-- 모달 -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-titlebar">
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <h3 id="modalTitle"></h3>
        <button class="modal-close" data-close aria-label="닫기">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <!-- 접수 애니메이션 -->
  <div class="sending" id="sending" hidden>
    <div class="sending-card">
      <div class="envelope"><div class="env-paper">📄</div><div class="env-body">✉️</div></div>
      <div class="sending-bar"><i id="sendingFill"></i></div>
      <p id="sendingText"></p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="assertive"></div>

  <!-- 데이터 → 설정 → 공통 → 저장소 → 앱 순서로 로드 -->
  <script src="js/config.js"></script>
  <script src="js/data/content.js"></script>
  <script src="js/data/forms.js"></script>
  <script src="js/data/cases.js"></script>
  <script src="js/render-shared.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
